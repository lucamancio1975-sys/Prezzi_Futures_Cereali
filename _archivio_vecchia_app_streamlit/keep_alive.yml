name: Keep Streamlit App Alive

on:
  schedule:
    # Esegue ogni 6 ore (ore 00:00, 06:00, 12:00, 18:00 UTC) per azzerare il timer di inattività Streamlit
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_url:
        description: 'URL alternativo dell app Streamlit da testare (opzionale)'
        required: false
        default: ''

jobs:
  ping-app:
    name: Ping e Risveglio Streamlit Cloud App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installazione Playwright e dipendenze di rete
        run: |
          pip install --upgrade pip
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Esecuzione Risveglio e Ping con Browser Headless
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
          INPUT_URL: ${{ github.event.inputs.custom_url }}
        run: |
          python execution/wake_streamlit_app.py
