<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Futures Grano - Quotazioni Giornaliere</title>
  
  <!-- Configurazione PWA Standard -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#030712">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Futures Grano">
  
  <!-- Configurazione Apple iOS (Safari & Schermata Home) -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" href="apple-touch-icon-precomposed.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Futures Grano">
  
  <!-- Favicon Browser -->
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

  <!-- Condivisione Social e WhatsApp (Open Graph) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Futures Grano — Quotazioni Ufficiali">
  <meta property="og:description" content="Dashboard quotidiana prezzi contratti di protezione Futures Grano Duro e Grano Tenero">
  <meta property="og:image" content="icon-512.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #030712;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #app-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    #app-frame {
      width: 100%;
      height: 100%;
      flex: 1;
      border: none;
      background-color: #030712;
      display: block;
    }

    /* Schermata di caricamento elegante */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #030712;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease-out, visibility 0.4s;
    }

    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .splash-logo {
      width: 86px;
      height: 86px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 25px rgba(245, 158, 11, 0.25);
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }

    .splash-title {
      color: #f3f4f6;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .splash-subtitle {
      color: #9ca3af;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .splash-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(245, 158, 11, 0.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <img src="icon-192.png" alt="Futures Grano" class="splash-logo">
    <div class="splash-title">Futures Cereali</div>
    <div class="splash-subtitle">Caricamento quotazioni in corso...</div>
    <div class="splash-spinner"></div>
  </div>

  <!-- Contenitore App a Schermo Intero -->
  <div id="app-container">
    <iframe 
      id="app-frame" 
      src="https://prezzifuturescereali-7saqhw3pevvq9rzzswqbpx.streamlit.app/?embed=true" 
      title="Futures Grano Dashboard"
      allow="clipboard-read; clipboard-write">
    </iframe>
  </div>

  <script>
    // 1. Registrazione Service Worker per PWA Android e PC
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { scope: './' })
          .then(reg => console.log('PWA Service Worker registrato con successo:', reg.scope))
          .catch(err => console.warn('Errore registrazione Service Worker:', err));
      });
    }

    // 2. Gestione rimozione fluida dello Splash Screen al caricamento dell'app
    const iframe = document.getElementById('app-frame');
    const splash = document.getElementById('splash-screen');

    function hideSplash() {
      if (splash && !splash.classList.contains('fade-out')) {
        splash.classList.add('fade-out');
        setTimeout(() => {
          splash.remove();
        }, 450);
      }
    }

    iframe.addEventListener('load', () => {
      hideSplash();
      window.scrollTo(0, 0);
      if (document.documentElement) document.documentElement.scrollTop = 0;
      if (document.body) document.body.scrollTop = 0;
    });

    // 3. Ascolto comandi di reset scroll verso l'alto inviati dall'app interna
    window.addEventListener('message', function(event) {
      if (event.data && event.data.action === 'SCROLL_TOP') {
        window.scrollTo(0, 0);
        if (document.documentElement) document.documentElement.scrollTop = 0;
        if (document.body) document.body.scrollTop = 0;
      }
    });

    // Timeout di sicurezza nel caso di connessione lenta (max 4.5s)
    setTimeout(hideSplash, 4500);
  </script>
</body>
</html>
