name: Sync Giornaliero Prezzi Futures da Gmail

on:
  schedule:
    # Esecuzioni pianificate nei giorni lavorativi (lun-ven):
    # Ore italiane: 08:00 (apertura), 11:00, 11:30, 12:00, 12:30, 13:00, 14:00, 15:00, 16:00, 17:00, 18:00 (chiusura)
    # Fuso orario UTC: -2 ore rispetto all'Italia
    - cron: '0 6 * * 1-5'
    - cron: '0,30 9,10,11 * * 1-5'
    - cron: '0 12,13,14,15,16 * * 1-5'
  workflow_dispatch: # Permette anche l'avvio manuale dal pannello Actions

jobs:
  sync:
    name: Estrazione e Aggiornamento Database
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installazione dipendenze e OCR di sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytesseract

      - name: Esecuzione Sync da Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python -c "
          import os
          if not os.getenv('GMAIL_USER') or not os.getenv('GMAIL_APP_PASSWORD'):
              print('ATTENZIONE: Secrets GMAIL_USER o GMAIL_APP_PASSWORD non configurati nei Secrets del repository!')
          from execution.fetch_gmail_quotes import fetch_quotes_from_gmail
          q, l = fetch_quotes_from_gmail(max_emails=35)
          for log_line in l:
              print(log_line)
          print(f'Quotazioni elaborate con successo: {len(q)}')
          "

      - name: Commit e Push automatico delle nuove quotazioni
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/storico_prezzi.json data/storico_prezzi.csv 2>/dev/null || git add -A
          if git diff --staged --quiet; then
            echo "Nessuna variazione al database, nessun commit necessario."
          else
            git commit -m "Auto-sync: nuove quotazioni futures cereali da Gmail"
            git pull --rebase origin main || true
            git push
          fi
