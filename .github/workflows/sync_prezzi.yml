name: Sync Giornaliero Prezzi Futures da Gmail

on:
  schedule:
    # Fasce orarie nei giorni lavorativi (lun-ven):
    # Mattina presto (08:12 - 09:42 italiane / 06:12 - 07:42 UTC) ogni 30 min
    - cron: '12,42 6-7 * * 1-5'
    # Finestra principale arrivo email (10:07 - 13:52 italiane / 08:07 - 11:52 UTC) OGNI 15 MINUTI
    - cron: '7,22,37,52 8-11 * * 1-5'
    # Pomeriggio e chiusura (14:12 - 18:42 italiane / 12:12 - 16:42 UTC) ogni 30 min
    - cron: '12,42 12-16 * * 1-5'
  workflow_dispatch: # Permette anche l'avvio manuale dal pannello Actions o da API

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync:
    name: Estrazione e Aggiornamento Database
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.git_push.outputs.has_changes }}
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installazione dipendenze e OCR di sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytesseract

      - name: Esecuzione Sync da Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import os, sys
          from execution.fetch_gmail_quotes import check_and_sync_today_quotes
          new_q, is_today, logs = check_and_sync_today_quotes(scan_depth=15)
          for log_line in logs:
              print(log_line)
          print(f'Sync completato: {len(new_q)} nuove quotazioni acquisite (Oggi presente: {is_today}).')
          "

      - name: Commit e Push automatico delle nuove quotazioni
        id: git_push
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/storico_prezzi.json data/storico_prezzi.csv 2>/dev/null || git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Nessuna variazione al database, nessun commit necessario."
          else
            git commit -m "Auto-sync: nuove quotazioni futures cereali da Gmail"
            git pull --rebase origin main || true
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Pubblicazione Web App su GitHub Pages
    needs: sync
    if: needs.sync.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurazione GitHub Pages
        uses: actions/configure-pages@v5

      - name: Caricamento Artifacts Web App
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Pubblicazione su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
